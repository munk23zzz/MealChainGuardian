[project]
name = "mealchain-guardian-backend"
version = "0.1.0"
description = "MealChain Guardian backend — tool deterministik + adapter SAP (docs/Architecture.md §4, §9)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
