# MealChain Guardian — layanan lokal (docs/Architecture.md §4)
#
# Catatan port: Postgres dipublikasikan di 55432 (bukan 5432/5433) supaya tidak bentrok dengan
# project lain di mesin yang sama. Backend/frontend menyusul sebagai service di file ini.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mealchain_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mealchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mealchain}
      POSTGRES_DB: ${POSTGRES_DB:-mealchain}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - mealchain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealchain} -d ${POSTGRES_DB:-mealchain}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mealchain_pgdata:
